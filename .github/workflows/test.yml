name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        django-version: ["4.2", "5.0"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin Django and install the package's extras in the SAME pip
          # invocation. Installing Django first and the extras afterward in
          # a separate command lets pip's resolver upgrade Django again to
          # satisfy djangorestframework's own minimum-Django constraint,
          # silently defeating this matrix.
          python -m pip install "Django~=${{ matrix.django-version }}.0" -e ".[drf,test]"

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=django_tenant_apikeys --cov-report=term-missing --cov-report=xml --cov-fail-under=100

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && matrix.django-version == '5.0'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Mypy
        run: mypy django_tenant_apikeys
