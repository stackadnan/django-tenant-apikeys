name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        django-version: ["4.2", "5.2"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin Django and install the package's extras in the SAME pip
          # invocation. Installing Django first and the extras afterward in
          # a separate command lets pip's resolver upgrade Django again to
          # satisfy djangorestframework's own minimum-Django constraint,
          # silently defeating this matrix.
          python -m pip install "Django~=${{ matrix.django-version }}.0" -e ".[drf,test]"

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=django_tenant_apikeys --cov-report=term-missing --cov-report=xml --cov-fail-under=100

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && matrix.django-version == '5.2'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  test-postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: django_tenant_apikeys_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django~=5.2.0" -e ".[drf,test]" "psycopg[binary]>=3.1"

      - name: Run tests against PostgreSQL
        env:
          POSTGRES_HOST: localhost
        run: python -m pytest --ds=tests.settings_postgres

  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Mypy
        run: mypy django_tenant_apikeys
