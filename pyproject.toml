[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "django-tenant-apikeys"
dynamic = ["version"]
description = "Pluggable multi-tenant API key authentication for Django, with first-class DRF and Django Ninja support."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "stackadnan", email = "brainxsolutionsseo@gmail.com" },
]
keywords = [
    "django",
    "api-key",
    "authentication",
    "multi-tenant",
    "multitenancy",
    "django-rest-framework",
    "django-ninja",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
dependencies = [
    "django>=4.2",
]

[project.optional-dependencies]
drf = [
    "djangorestframework>=3.14",
]
ninja = [
    "django-ninja>=1.0",
]
test = [
    "pytest>=7.4",
    "pytest-django>=4.7",
    "pytest-cov>=4.1",
    "djangorestframework>=3.14",
]
dev = [
    "django-tenant-apikeys[test]",
    "mypy>=1.8",
    "django-stubs>=4.2",
    "djangorestframework-stubs>=3.14",
    "ruff>=0.4",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/stackadnan/django-tenant-apikeys"
Documentation = "https://github.com/stackadnan/django-tenant-apikeys#readme"
Repository = "https://github.com/stackadnan/django-tenant-apikeys"
Issues = "https://github.com/stackadnan/django-tenant-apikeys/issues"
Changelog = "https://github.com/stackadnan/django-tenant-apikeys/releases"

[tool.hatch.version]
path = "django_tenant_apikeys/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["django_tenant_apikeys"]

[tool.hatch.build.targets.sdist]
include = [
    "/django_tenant_apikeys",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["django_tenant_apikeys"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
